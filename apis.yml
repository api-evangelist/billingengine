x-submission-notes: 'What does it do?

  BillingEngine is online invoicing software for freelancers and small businesses in Germany. The REST API lets you list, create and change customers
  and draft invoices, record payments, and download invoices as PDF or as an XML e-invoice (ZUGFeRD / XRechnung, EN 16931). The MCP server (billingengine-mcp)
  exposes the same functions to AI assistants such as Claude and Cursor. It cannot delete anything and sends nothing to customers. Both need an
  API key from a paid plan.


  Who maint'
