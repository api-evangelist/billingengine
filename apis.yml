aid: billingengine
name: BillingEngine
description: BillingEngine provides online invoicing software tailored for freelancers and small businesses in Germany. Its REST API enables listing,
  creating, and updating customers and draft invoices, recording payments, and downloading invoices as PDF or XML e‑invoices (ZUGFeRD / XRechnung,
  EN 16931). The platform also offers an MCP server for AI assistants, requiring an API key from a paid plan.
